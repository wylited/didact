<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>x86-64 · literate assembly (unicorn)</title>
  <link rel="icon" href="data:," />
</head>
<body>
  <header class="toolbar">
    <span class="brand">x86-64<em>unicorn</em></span>
    <div class="controls">
      <button id="btn-run" class="primary" data-test="run" title="Assemble the active block — click again to run to completion">▶ Run</button>
      <button id="btn-step" data-test="step" title="Execute exactly one instruction">⤵ Step</button>
      <button id="btn-reset" data-test="reset" title="Restore the initial machine state">⟲ Reset</button>
    </div>
    <span id="status" data-test="status" class="status status-muted">loading engines…</span>
  </header>

  <main class="panes">
    <article id="lesson" class="lesson"><p class="loading-doc">loading lesson…</p></article>

    <aside id="machine" class="machine">
      <section class="panel">
        <h2>Registers</h2>
        <div id="registers" class="reg-grid"></div>
      </section>
      <section class="panel">
        <h2>Flags</h2>
        <div id="flags" class="flags"></div>
      </section>
      <section class="panel panel-grow">
        <h2>Disassembly</h2>
        <div id="disasm" class="disasm"><div class="empty">run a block to populate the listing</div></div>
      </section>
      <section class="panel">
        <h2>Memory · .data</h2>
        <div id="memory" class="memory"></div>
      </section>
      <section class="panel">
        <h2>Output</h2>
        <pre id="output" data-test="output" class="console"></pre>
      </section>
    </aside>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
