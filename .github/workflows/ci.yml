name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Bun is only needed until test:smoke migrates off Bun.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: |
            .typst-cache
            apps/site/node_modules/.vite/didact-typst
          key: typst-cache-${{ runner.os }}-${{ hashFiles('apps/site/src/pages/*.org') }}
          restore-keys: |
            typst-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check
      - run: pnpm typst:check
      - run: pnpm build
